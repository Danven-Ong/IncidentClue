# Standalone stack: never merge this file into compose.yaml.
name: incidentclue-rag

x-rag: &rag
  image: incidentclue:rag
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: rag
  read_only: true
  tmpfs:
    - /tmp:uid=10001,gid=10001,mode=0700
  environment: &rag-env
    INCIDENTCLUE_DATABASE_URL: postgresql://incidentclue:rag-local-development-only@postgres:5432/incidentclue_rag
    INCIDENTCLUE_RAG_MODEL_DIR: /models/embedding
  volumes:
    - type: bind
      source: ${INCIDENTCLUE_RAG_MODEL_DIR:?Set the absolute path to verified local embedding files}
      target: /models/embedding
      read_only: true
      bind:
        create_host_path: false

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17@sha256:99a149d3c84cfb0f32d8da7d72737e4643468787220af2223418730f8e9e9cdc
    environment:
      POSTGRES_USER: incidentclue
      POSTGRES_PASSWORD: rag-local-development-only
      POSTGRES_DB: incidentclue_rag
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  storage-setup:
    <<: *rag
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [python, -m, incidentclue.api.storage_setup]
    command: []

  rag-setup:
    <<: *rag
    profiles: [admin]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [python, -m, incidentclue.rag]
    command: [setup]

  rag-ingest:
    <<: *rag
    profiles: [admin]
    depends_on:
      rag-setup:
        condition: service_completed_successfully
    entrypoint: [python, -m, incidentclue.rag]
    command: [ingest, --root, /opt/incidentclue, --max-distance, "0.3", --model-dir, /models/embedding]

  admin:
    <<: *rag
    profiles: [admin]
    entrypoint: [python, -m, incidentclue.rag]
    command: [--help]

  web:
    <<: *rag
    depends_on:
      storage-setup:
        condition: service_completed_successfully
    environment:
      <<: *rag-env
      # Empty by default. Enable only after explicit setup/ingestion.
      INCIDENTCLUE_RAG_CORPUS_ID: ${INCIDENTCLUE_RAG_CORPUS_ID:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    entrypoint: [python, -m, uvicorn]
    command: [incidentclue.api.app:create_app, --factory, --host, 0.0.0.0, --port, "8000", --no-access-log]
    ports:
      - "127.0.0.1:${INCIDENTCLUE_RAG_WEB_PORT:-8001}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"]
      interval: 3s
      timeout: 6s
      retries: 20

  frontend:
    image: incidentclue-frontend:local
    build:
      context: ./frontend
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:${INCIDENTCLUE_RAG_FRONTEND_PORT:-8081}:8080"

volumes:
  rag-postgres-data:
