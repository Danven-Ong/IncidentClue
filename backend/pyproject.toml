[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentclue"
version = "0.1.0"
description = "Evidence-based investigation of software incidents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "psycopg[binary]>=3.3,<4",
    "openai>=3.40,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "build>=1.6,<2",
    "httpx2>=2.16,<3",
    "pytest>=8,<10",
    "ruff>=0.17,<0.18",
    "setuptools>=84,<85",
    "wheel>=0.48,<0.49",
]

[project.scripts]
incidentclue = "incidentclue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires an explicitly configured isolated PostgreSQL database"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
