name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        shell: bash
    env:
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
      OPENAI_LOG: warning
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      - name: Install pinned dependencies and tooling
        run: python -m pip install -r backend/requirements-dev.lock.txt
      - name: Lint backend
        run: python -m ruff check --config backend/pyproject.toml backend
      - name: Build source distribution and wheel
        run: python -m build --no-isolation backend
      - name: Install built wheel
        run: python -m pip install --no-deps backend/dist/*.whl
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run offline tests against installed package
        run: python -m pytest backend/tests -q
      - name: Smoke installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -I -m incidentclue.cli --help
          incidentclue investigate --help

  container:
    name: Container build and offline smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --file backend/Dockerfile --tag incidentclue:ci --tag incidentclue:local .
      - name: Check installed commands without networking
        run: |
          docker run --rm --network none --read-only incidentclue:ci --help
          docker run --rm --network none --read-only incidentclue:ci investigate --help
      - name: Check runtime identity and installed dependencies
        run: |
          docker run --rm --network none --read-only --entrypoint python incidentclue:ci -c '
          import importlib.util, os
          from pathlib import Path
          assert os.getuid() == 10001
          assert importlib.util.find_spec("pytest") is None
          assert importlib.util.find_spec("ruff") is None
          assert importlib.util.find_spec("build") is None
          assert not Path("/app/.env").exists()
          assert not Path("/app/data").exists()
          '
          docker run --rm --network none --read-only --entrypoint python incidentclue:ci -m pip check
      - name: Check mounted input and error record without credentials
        run: |
          set +e
          output=$(docker run --rm --network none --read-only \
            --tmpfs /app/runs:uid=10001,gid=10001,mode=0700 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/data/synthetic,target=/inputs,readonly" \
            incidentclue:ci diagnose /inputs/checkout.json --record-dir /app/runs 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          [[ "$output" == *"Set GROQ_API_KEY"* ]]
          [[ "$output" == *"Run record:"* ]]

      - name: Validate Compose and smoke commands offline
        env:
          INCIDENTCLUE_NETWORK_MODE: none
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose run --rm --no-deps -T incidentclue --help
          set +e
          output=$(docker compose run --rm --no-deps -T incidentclue 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          [[ "$output" == *"Set GROQ_API_KEY"* ]]
          [[ "$output" == *"Run record:"* ]]
          docker compose run --rm --no-deps -T --entrypoint python incidentclue -c '
          import json
          from pathlib import Path
          records = list(Path("/app/runs").glob("*.json"))
          assert records
          record = json.loads(records[0].read_text())
          assert record["outcome"] == "configuration_error"
          assert record["exit_code"] == 2
          assert record["log_snapshot"]["serialized_sha256"]
          '

  gate:
    name: CI gate
    needs: [backend, container]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BACKEND_RESULT: ${{ needs.backend.result }}
      CONTAINER_RESULT: ${{ needs.container.result }}
    steps:
      - name: Require backend and container checks to succeed
        run: test "$BACKEND_RESULT" = success && test "$CONTAINER_RESULT" = success
