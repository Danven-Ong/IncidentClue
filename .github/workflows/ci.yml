name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        shell: bash
    env:
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
      OPENAI_LOG: warning
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      - name: Install pinned dependencies and tooling
        run: python -m pip install -r backend/requirements-dev.lock.txt
      - name: Lint backend
        run: python -m ruff check --config backend/pyproject.toml backend
      - name: Build source distribution and wheel
        run: python -m build --no-isolation backend
      - name: Install built wheel
        run: python -m pip install --no-deps backend/dist/*.whl
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run offline tests against installed package
        run: python -m pytest backend/tests -q
      - name: Smoke installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -I -m incidentclue.cli --help
          incidentclue investigate --help

  container:
    name: Container build and offline smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --file backend/Dockerfile --tag incidentclue:ci --tag incidentclue:local .
      - name: Check installed commands without networking
        run: |
          docker run --rm --network none --read-only incidentclue:ci --help
          docker run --rm --network none --read-only incidentclue:ci investigate --help
      - name: Check runtime identity and installed dependencies
        run: |
          docker run --rm --network none --read-only --entrypoint python incidentclue:ci -c '
          import importlib.util, os
          from pathlib import Path
          assert os.getuid() == 10001
          assert importlib.util.find_spec("pytest") is None
          assert importlib.util.find_spec("ruff") is None
          assert importlib.util.find_spec("build") is None
          assert not Path("/app/.env").exists()
          assert not Path("/app/data").exists()
          '
          docker run --rm --network none --read-only --entrypoint python incidentclue:ci -m pip check
      - name: Check mounted input and error record without credentials
        run: |
          set +e
          output=$(docker run --rm --network none --read-only \
            --tmpfs /app/runs:uid=10001,gid=10001,mode=0700 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/data/synthetic,target=/inputs,readonly" \
            incidentclue:ci diagnose /inputs/checkout.json --record-dir /app/runs 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          [[ "$output" == *"Set GROQ_API_KEY"* ]]
          [[ "$output" == *"Run record:"* ]]

      - name: Validate Compose and smoke commands offline
        env:
          INCIDENTCLUE_NETWORK_MODE: none
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose run --rm --no-deps -T incidentclue --help
          set +e
          output=$(docker compose run --rm --no-deps -T incidentclue 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          [[ "$output" == *"Set GROQ_API_KEY"* ]]
          [[ "$output" == *"Run record:"* ]]
          docker compose run --rm --no-deps -T --entrypoint python incidentclue -c '
          import json
          from pathlib import Path
          records = list(Path("/app/runs").glob("*.json"))
          assert records
          record = json.loads(records[0].read_text())
          assert record["outcome"] == "configuration_error"
          assert record["exit_code"] == 2
          assert record["log_snapshot"]["serialized_sha256"]
          '

      - name: Verify durable Compose state survives PostgreSQL restart without a provider key
        run: |
          docker compose --profile durable up -d --wait postgres
          docker compose run --rm -T durable db-init
          docker compose run --rm -T durable start /inputs/checkout-startup.json \
            --health-file /inputs/checkout-health.json --paused > /tmp/paused.json
          investigation_id=$(python -c 'import json; print(json.load(open("/tmp/paused.json"))["investigation_id"])')
          docker compose restart postgres
          docker compose --profile durable up -d --wait postgres
          docker compose run --rm -T durable inspect "$investigation_id" > /tmp/restored.json
          python -c '
          import json
          before = json.load(open("/tmp/paused.json"))
          after = json.load(open("/tmp/restored.json"))
          assert after["investigation_id"] == before["investigation_id"]
          assert after["state"] == before["state"]
          assert after["checkpoint_id"] == before["checkpoint_id"]
          assert after["charged"] == {"model": 0, "tool": 0}
          assert after["compatible"] and after["status"] == "paused"
          '
          docker compose --profile durable down

      - name: Verify HTTP service and API-created state through server and database restart
        run: |
          docker compose --profile web up -d --wait web
          investigation_id=$(python backend/tests/compose_api_smoke.py http://127.0.0.1:8000 /tmp/http-created.json create)
          docker compose run --rm -T durable inspect "$investigation_id" > /tmp/http-via-cli.json
          python -c 'import json; assert json.load(open("/tmp/http-created.json"))["state"] == json.load(open("/tmp/http-via-cli.json"))["state"]'
          docker compose restart postgres web
          docker compose --profile web up -d --wait web
          python backend/tests/compose_api_smoke.py http://127.0.0.1:8000 /tmp/http-created.json inspect
          docker compose --profile web down

      - name: Verify built frontend and same-origin API across restarts
        run: |
          docker compose build frontend
          docker compose --profile frontend up -d --wait frontend
          python backend/tests/compose_api_smoke.py http://127.0.0.1:8080/api /tmp/frontend-created.json create
          docker compose restart postgres web frontend
          docker compose --profile frontend up -d --wait frontend
          python backend/tests/compose_api_smoke.py http://127.0.0.1:8080/api /tmp/frontend-created.json inspect
          python -c '
          import json, urllib.request, urllib.error
          response = urllib.request.urlopen("http://127.0.0.1:8080/")
          html = response.read()
          assert b"IncidentClue" in html
          assert "script-src" in response.headers["Content-Security-Policy"]
          import re
          asset = re.search(rb"src=\x22([^\x22]+\.js)\x22", html).group(1).decode()
          for path in (asset, "/api/health"):
              headers = urllib.request.urlopen("http://127.0.0.1:8080" + path).headers
              assert headers["X-Content-Type-Options"] == "nosniff"
              assert "script-src" in headers["Content-Security-Policy"]
          request = urllib.request.Request("http://127.0.0.1:8080/api/investigations", data=b"x" * 100001, method="POST")
          try:
              urllib.request.urlopen(request)
              raise AssertionError("Oversize request accepted")
          except urllib.error.HTTPError as error:
              assert error.code == 413
              assert json.load(error)["error"]["code"] == "request_too_large"
          '
          docker compose --profile frontend down

      - name: Verify fresh one-command startup without CLI or an environment-file mount
        run: |
          docker compose -p incidentclue-startup-ci --env-file .env.example --profile frontend up --build -d --wait frontend
          python backend/tests/compose_api_smoke.py http://127.0.0.1:8080/api /tmp/one-command-created.json create
          docker compose -p incidentclue-startup-ci --env-file .env.example --profile frontend up -d --wait frontend
          python backend/tests/compose_api_smoke.py http://127.0.0.1:8080/api /tmp/one-command-created.json inspect
          docker compose -p incidentclue-startup-ci --env-file .env.example --profile frontend restart postgres web frontend
          docker compose -p incidentclue-startup-ci --env-file .env.example --profile frontend up -d --wait frontend
          python backend/tests/compose_api_smoke.py http://127.0.0.1:8080/api /tmp/one-command-created.json inspect
          docker compose -p incidentclue-startup-ci --env-file .env.example --profile frontend down

  postgres:
    name: PostgreSQL recovery (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_USER: incidentclue
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: incidentclue_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incidentclue -d incidentclue_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
      OPENAI_LOG: warning
      INCIDENTCLUE_TEST_DATABASE_URL: postgresql://incidentclue:ci-only-password@localhost:5432/incidentclue_test
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies and built package
        run: |
          python -m pip install -r backend/requirements-dev.lock.txt
          python -m build --no-isolation backend
          python -m pip install --no-deps backend/dist/*.whl
          python -m pip check
      - name: Verify PostgreSQL checkpoints, crashes, budgets and concurrency offline
        run: python -m pytest backend/tests -m postgres -q

  frontend:
    name: Frontend and browser (Node 24, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_USER: incidentclue
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: incidentclue_frontend_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incidentclue -d incidentclue_frontend_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
      INCIDENTCLUE_BROWSER_DATABASE_URL: postgresql://incidentclue:ci-only-password@localhost:5432/incidentclue_frontend_test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install backend fixture dependencies and built package
        working-directory: .
        run: |
          python -m pip install -r backend/requirements-dev.lock.txt
          python -m build --no-isolation backend
          python -m pip install --no-deps backend/dist/*.whl
      - name: Install pinned frontend dependencies
        run: npm ci --ignore-scripts
      - name: Type check, build, lint and test
        run: |
          npm run build
          npm run lint
          npm test
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser and real API integration with fake provider
        run: npm run test:browser

  gate:
    name: CI gate
    needs: [backend, container, postgres, frontend]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BACKEND_RESULT: ${{ needs.backend.result }}
      CONTAINER_RESULT: ${{ needs.container.result }}
      POSTGRES_RESULT: ${{ needs.postgres.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
    steps:
      - name: Require backend, container and PostgreSQL checks to succeed
        run: test "$BACKEND_RESULT" = success && test "$CONTAINER_RESULT" = success && test "$POSTGRES_RESULT" = success && test "$FRONTEND_RESULT" = success
