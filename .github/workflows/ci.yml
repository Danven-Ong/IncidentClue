name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        shell: bash
    env:
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
      OPENAI_LOG: warning
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      - name: Install pinned dependencies and tooling
        run: python -m pip install -r backend/requirements-dev.lock.txt
      - name: Lint backend
        run: python -m ruff check --config backend/pyproject.toml backend
      - name: Build source distribution and wheel
        run: python -m build --no-isolation backend
      - name: Install built wheel
        run: python -m pip install --no-deps backend/dist/*.whl
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run offline tests against installed package
        run: python -m pytest backend/tests -q
      - name: Smoke installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -I -m incidentclue.cli --help
          incidentclue investigate --help

  gate:
    name: CI gate
    needs: backend
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BACKEND_RESULT: ${{ needs.backend.result }}
    steps:
      - name: Require every backend job to succeed
        run: test "$BACKEND_RESULT" = success
