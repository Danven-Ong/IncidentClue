name: incidentclue

x-backend: &backend
  image: ${INCIDENTCLUE_IMAGE:-incidentclue:local}
  build:
    context: .
    dockerfile: backend/Dockerfile
  read_only: true
  tmpfs:
    - /tmp:uid=10001,gid=10001,mode=0700

x-model-volume: &model-volume
  type: bind
  source: ${INCIDENTCLUE_RAG_MODEL_DIR:-./models}
  target: /models/embedding
  read_only: true
  bind:
    create_host_path: false

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17@sha256:99a149d3c84cfb0f32d8da7d72737e4643468787220af2223418730f8e9e9cdc
    profiles: [durable, web, frontend, admin]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incidentclue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-incidentclue}
    ports:
      - "127.0.0.1:${INCIDENTCLUE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  durable:
    <<: *backend
    profiles: [durable]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Override the complete URI when using credentials that need URI encoding.
      INCIDENTCLUE_DATABASE_URL: ${INCIDENTCLUE_COMPOSE_DATABASE_URL:-postgresql://incidentclue:local-development-only@postgres:5432/incidentclue}
      INCIDENTCLUE_RAG_MODEL_DIR: /models/embedding
    volumes:
      - *model-volume
      - type: bind
        source: ./data/synthetic
        target: /inputs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.env
        target: /config/provider.env
        read_only: true
        bind:
          create_host_path: false
    command: ["--help"]

  storage-setup:
    <<: *backend
    profiles: [web, frontend]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INCIDENTCLUE_DATABASE_URL: ${INCIDENTCLUE_COMPOSE_DATABASE_URL:-postgresql://incidentclue:local-development-only@postgres:5432/incidentclue}
    entrypoint: [python, -m, incidentclue.api.storage_setup]
    command: []

  web:
    <<: *backend
    profiles: [web, frontend]
    depends_on:
      postgres:
        condition: service_healthy
      storage-setup:
        condition: service_completed_successfully
    environment:
      INCIDENTCLUE_DATABASE_URL: ${INCIDENTCLUE_COMPOSE_DATABASE_URL:-postgresql://incidentclue:local-development-only@postgres:5432/incidentclue}
      INCIDENTCLUE_RAG_CORPUS_ID: ${INCIDENTCLUE_RAG_CORPUS_ID:-}
      INCIDENTCLUE_RAG_MODEL_DIR: /models/embedding
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    volumes:
      - *model-volume
    ports:
      - "127.0.0.1:${INCIDENTCLUE_WEB_PORT:-8000}:8000"
    entrypoint: [python, -m, uvicorn]
    command:
      - incidentclue.api.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"]
      interval: 3s
      timeout: 6s
      retries: 20
      start_period: 5s

  frontend:
    image: incidentclue-frontend:local
    profiles: [frontend]
    build:
      context: ./frontend
    read_only: true
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INCIDENTCLUE_FRONTEND_PORT:-8080}:8080"
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: [CMD, wget, --quiet, --spider, "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 5s
      retries: 20

  incidentclue:
    <<: *backend
    network_mode: ${INCIDENTCLUE_NETWORK_MODE:-bridge}
    volumes:
      - type: bind
        source: ./data/synthetic
        target: /inputs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.env
        target: /config/provider.env
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: runs
        target: /app/runs
    command:
      - investigate
      - /inputs/checkout-startup.json
      - --health-file
      - /inputs/checkout-health.json
      - --logs-file
      - /inputs/checkout-logs.json
      - --env-file
      - /config/provider.env
      - --record-dir
      - /app/runs

  rag-setup:
    <<: *backend
    profiles: [admin]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INCIDENTCLUE_DATABASE_URL: ${INCIDENTCLUE_COMPOSE_DATABASE_URL:-postgresql://incidentclue:local-development-only@postgres:5432/incidentclue}
    entrypoint: [python, -m, incidentclue.rag]
    command: [setup]

  rag-ingest:
    <<: *backend
    profiles: [admin]
    depends_on:
      rag-setup:
        condition: service_completed_successfully
    environment:
      INCIDENTCLUE_DATABASE_URL: ${INCIDENTCLUE_COMPOSE_DATABASE_URL:-postgresql://incidentclue:local-development-only@postgres:5432/incidentclue}
    volumes:
      - *model-volume
    entrypoint: [python, -m, incidentclue.rag]
    command: [ingest, --root, /opt/incidentclue, --max-distance, "0.3", --model-dir, /models/embedding]

  admin:
    <<: *backend
    profiles: [admin]
    environment:
      INCIDENTCLUE_DATABASE_URL: ${INCIDENTCLUE_COMPOSE_DATABASE_URL:-postgresql://incidentclue:local-development-only@postgres:5432/incidentclue}
    volumes:
      - *model-volume
    entrypoint: [python, -m, incidentclue.rag]
    command: [--help]

volumes:
  postgres-data:
  runs:
    name: incidentclue-compose-runs
