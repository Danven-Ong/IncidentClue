server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    error_log /dev/stderr warn;
    # Forward oversize API requests so the API returns its typed 413 envelope.
    client_max_body_size 0;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control no-store always;
    location = /api { return 308 /api/; }
    location /api/ {
        # Runtime DNS resolution lets the proxy survive API container replacement.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://web:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_intercept_errors off;
        add_header Cache-Control no-store always;
    }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ =404; }
}
